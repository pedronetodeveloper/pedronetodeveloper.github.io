<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="led" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B" stop-opacity=".25"/>
      <stop offset=".15" stop-color="#FCD34D"/>
      <stop offset=".85" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F59E0B" stop-opacity=".45"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <!-- fundo: tema terminal -->
  <rect width="64" height="64" rx="14" fill="#0B1220"/>
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#1E293B" stroke-width="1.5"/>

  <!-- barra de LED com glow -->
  <rect x="10" y="12" width="44" height="5" rx="2.5" fill="#FCD34D" opacity=".9" filter="url(#blur)"/>
  <rect x="10" y="12" width="44" height="5" rx="2.5" fill="url(#led)"/>
  <rect x="13" y="18" width="38" height="16" fill="url(#glow)"/>

  <!-- P iluminado pela luminária -->
  <text x="32" y="52" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Menlo,monospace" font-weight="800" font-size="34" fill="#E2E8F0">P</text>
</svg>
